<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MC Java Host</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Minecraft Java Edition</p>
          <h1>MC Java Host</h1>
        </div>
        <div class="status-pill" id="statusPill">
          <span class="status-dot"></span>
          <span id="statusText">확인 중</span>
        </div>
      </header>

      <section class="overview">
        <div class="metric">
          <span>서버</span>
          <strong id="runningMetric">중지됨</strong>
        </div>
        <div class="metric">
          <span>버전</span>
          <strong id="versionMetric">-</strong>
        </div>
        <div class="metric">
          <span>포트</span>
          <strong id="portMetric">25565</strong>
        </div>
        <div class="metric">
          <span>LAN 주소</span>
          <strong id="addressMetric">-</strong>
        </div>
      </section>

      <section class="workspace">
        <div class="panel controls-panel">
          <div class="panel-head">
            <h2>제어</h2>
            <button class="icon-button" id="refreshButton" title="새로고침" aria-label="새로고침">↻</button>
          </div>

          <div class="button-row">
            <button class="primary" id="startButton">시작</button>
            <button class="danger" id="stopButton">중지</button>
            <button id="downloadButton">서버 jar 받기</button>
            <button id="backupButton">월드 백업</button>
          </div>

          <label class="check-row">
            <input type="checkbox" id="eulaCheck" />
            <span>시작 시 Minecraft EULA에 동의하고 `eula=true` 저장</span>
          </label>

          <div class="download" id="downloadBox" hidden>
            <div class="download-top">
              <span>다운로드</span>
              <strong id="downloadPercent">0%</strong>
            </div>
            <div class="progress">
              <span id="downloadBar"></span>
            </div>
          </div>
        </div>

        <form class="panel settings-panel" id="settingsForm">
          <div class="panel-head">
            <h2>설정</h2>
            <button type="submit">저장</button>
          </div>

          <div class="field-grid">
            <label>
              <span>버전</span>
              <select id="versionSelect" name="version">
                <option value="latest-release">최신 release</option>
              </select>
            </label>
            <label>
              <span>최소 RAM</span>
              <input id="memoryMin" name="memoryMin" value="1G" />
            </label>
            <label>
              <span>최대 RAM</span>
              <input id="memoryMax" name="memoryMax" value="2G" />
            </label>
            <label>
              <span>포트</span>
              <input id="serverPort" name="server-port" inputmode="numeric" value="25565" />
            </label>
            <label>
              <span>서버 이름</span>
              <input id="motd" name="motd" value="Hosted by MC Java Host" />
            </label>
            <label>
              <span>최대 인원</span>
              <input id="maxPlayers" name="max-players" inputmode="numeric" value="10" />
            </label>
            <label>
              <span>난이도</span>
              <select id="difficulty" name="difficulty">
                <option value="peaceful">peaceful</option>
                <option value="easy">easy</option>
                <option value="normal">normal</option>
                <option value="hard">hard</option>
              </select>
            </label>
            <label>
              <span>게임모드</span>
              <select id="gamemode" name="gamemode">
                <option value="survival">survival</option>
                <option value="creative">creative</option>
                <option value="adventure">adventure</option>
                <option value="spectator">spectator</option>
              </select>
            </label>
          </div>

          <div class="toggle-grid">
            <label><input type="checkbox" id="onlineMode" name="online-mode" /> 정품 인증</label>
            <label><input type="checkbox" id="whiteList" name="white-list" /> 화이트리스트</label>
            <label><input type="checkbox" id="pvp" name="pvp" /> PvP</label>
          </div>
        </form>

        <div class="panel console-panel">
          <div class="panel-head">
            <h2>콘솔</h2>
            <span class="hint" id="javaHint">Java 확인 중</span>
          </div>
          <div class="log" id="log"></div>
          <form class="command-row" id="commandForm">
            <input id="commandInput" autocomplete="off" placeholder="명령어 입력: say hello" />
            <button type="submit">전송</button>
          </form>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" hidden></div>
    <script src="/app.js"></script>
  </body>
</html>
